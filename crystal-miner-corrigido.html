<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>💎 Crystal Miner - Clicker Game</title>
    <style>
        /* ... (estilos mantidos, sem alterações) ... */
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: rgba(255, 255, 255, 0.06);
            --bg-card-hover: rgba(255, 255, 255, 0.12);
            --border-color: rgba(255, 255, 255, 0.15);
            --border-glow: rgba(0, 255, 255, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #b0b0cc;
            --text-dim: #707090;
            --accent-cyan: #00ffff;
            --accent-magenta: #ff00ff;
            --accent-gold: #ffd700;
            --accent-green: #00ff88;
            --accent-orange: #ff8800;
            --accent-red: #ff4466;
            --shadow-glow: 0 0 30px rgba(0, 255, 255, 0.3);
            --shadow-glow-strong: 0 0 60px rgba(0, 255, 255, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
            overscroll-behavior: none;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            background: radial-gradient(ellipse at 50% 20%, #1a1a3e 0%, #0a0a1a 60%);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.3), transparent),
                        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.2), transparent),
                        radial-gradient(2px 2px at 50% 40%, rgba(255,255,255,0.3), transparent),
                        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.2), transparent),
                        radial-gradient(2px 2px at 90% 10%, rgba(255,255,255,0.25), transparent);
            background-size: 200% 200%;
            animation: starDrift 30s linear infinite;
            z-index: 0;
        }

        @keyframes starDrift {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        #header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }

        .stat-item .icon { font-size: 1.1rem; }
        .stat-item .value { color: var(--text-primary); font-size: 0.9rem; font-weight: 700; }
        .stat-item.crystals .value { color: var(--accent-cyan); text-shadow: 0 0 12px rgba(0,255,255,0.6); }
        .stat-item.cps .value { color: var(--accent-gold); text-shadow: 0 0 12px rgba(255,215,0,0.6); }
        .stat-item.level .value { color: var(--accent-magenta); text-shadow: 0 0 12px rgba(255,0,255,0.6); }
        .stat-item.gacha-coins .value { color: var(--accent-orange); text-shadow: 0 0 12px rgba(255,136,0,0.6); }

        .level-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        #levelBarFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 12px 12px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        #crystalArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 0;
            position: relative;
            min-height: 260px;
        }

        #crystalWrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #crystalWrapper::before,
        #crystalWrapper::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        #crystalWrapper::before {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, transparent 70%);
            animation: pulseRing 2.5s ease-in-out infinite;
        }
        #crystalWrapper::after {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(255,0,255,0.12) 0%, transparent 70%);
            animation: pulseRing 3.5s ease-in-out infinite reverse;
        }
        @keyframes pulseRing {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        #crystalButton {
            width: 140px;
            height: 140px;
            border: none;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(0,255,255,0.4) 0%, rgba(0,255,255,0.15) 40%, rgba(255,0,255,0.2) 70%, rgba(255,0,255,0.35) 100%);
            box-shadow: 0 0 40px rgba(0,255,255,0.5), 0 0 80px rgba(255,0,255,0.3), inset 0 0 30px rgba(255,255,255,0.2), 0 4px 24px rgba(0,0,0,0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.2rem;
            position: relative;
            z-index: 2;
            transition: transform 0.1s ease, box-shadow 0.15s ease;
            animation: crystalFloat 3s ease-in-out infinite;
            border: 3px solid rgba(255,255,255,0.4);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0,255,255,0.7));
        }
        #crystalButton:active {
            transform: scale(0.88) !important;
            box-shadow: 0 0 60px rgba(0,255,255,0.7), 0 0 120px rgba(255,0,255,0.5), inset 0 0 20px rgba(255,255,255,0.3), 0 2px 12px rgba(0,0,0,0.5);
            transition: transform 0.05s ease, box-shadow 0.08s ease;
        }
        @keyframes crystalFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        #crystalButton .shine {
            position: absolute;
            top: 12%;
            left: 20%;
            width: 30%;
            height: 20%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.8) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: shineMove 4s ease-in-out infinite;
        }
        @keyframes shineMove {
            0%, 100% { transform: translateX(0) rotate(0deg); opacity: 0.8; }
            50% { transform: translateX(18px) rotate(5deg); opacity: 1; }
        }

        #clickPowerDisplay {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-weight: 600;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }
        #clickPowerDisplay span { color: var(--accent-cyan); font-weight: 700; }

        #goldenCrystal {
            position: absolute;
            z-index: 10;
            font-size: 2.8rem;
            cursor: pointer;
            animation: goldenPulse 0.8s ease-in-out infinite, goldenFloat 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.9));
            transition: transform 0.1s ease;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        #goldenCrystal:active { transform: scale(0.8) !important; }
        @keyframes goldenPulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255,215,0,0.7)); }
            50% { filter: drop-shadow(0 0 40px rgba(255,215,0,1)); }
        }
        @keyframes goldenFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        #goldenCrystal.hidden { display: none; }

        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 50;
            animation: particleFly 0.8s ease-out forwards;
        }
        @keyframes particleFly {
            0% { opacity: 1; transform: translate(0,0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
        }
        .floating-text {
            position: fixed;
            pointer-events: none;
            z-index: 60;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0,255,255,0.8), 0 2px 4px rgba(0,0,0,0.5);
            animation: floatUp 1s ease-out forwards;
        }
        .floating-text.golden {
            color: var(--accent-gold);
            font-size: 1.4rem;
            text-shadow: 0 0 20px rgba(255,215,0,0.9), 0 2px 4px rgba(0,0,0,0.6);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            60% { opacity: 1; transform: translateY(-40px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }

        #tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 4px;
            border: 1px solid var(--border-color);
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex: 1;
            min-width: 60px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            padding: 10px 6px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            font-family: var(--font);
            letter-spacing: 0.3px;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .tab.active {
            background: rgba(0,255,255,0.15);
            color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0,255,255,0.15);
        }
        .tab:not(.active):hover { color: var(--text-secondary); background: var(--bg-card-hover); }
        .tab .badge {
            position: absolute;
            top: -2px;
            right: 4px;
            background: var(--accent-gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px rgba(255,215,0,0.6);
        }
        .tab .badge.hidden { display: none; }

        #tabContent {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
            padding-bottom: calc(20px + var(--safe-bottom));
        }
        #tabContent::-webkit-scrollbar { width: 4px; }
        #tabContent::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Upgrades */
        #upgradesList { display: flex; flex-direction: column; gap: 8px; }
        .upgrade-filter {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }
        .upgrade-filter-btn {
            flex: 1;
            padding: 6px 8px;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.2s;
        }
        .upgrade-filter-btn.active {
            background: rgba(0,255,255,0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }
        .upgrade-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }
        .upgrade-card:hover { background: var(--bg-card-hover); border-color: rgba(255,255,255,0.3); }
        .upgrade-card:active { transform: scale(0.97); transition: transform 0.08s ease; }
        .upgrade-card.affordable { border-color: rgba(0,255,255,0.6); box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        .upgrade-card.not-affordable { opacity: 0.55; cursor: not-allowed; }
        .upgrade-card.maxed { border-color: var(--accent-gold); opacity: 0.9; box-shadow: 0 0 16px rgba(255,215,0,0.25); }
        .upgrade-card.maxed .cost-value { color: var(--accent-gold); font-weight: bold; }
        .upgrade-card.purchased { animation: cardPurchased 0.3s ease; border-color: var(--accent-gold); }
        @keyframes cardPurchased {
            0% { transform: scale(1); background: rgba(255,215,0,0.2); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .upgrade-icon { font-size: 2rem; min-width: 48px; text-align: center; filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)); }
        .upgrade-info { flex: 1; }
        .upgrade-name { font-size: 0.9rem; font-weight: 700; color: var(--text-primary); margin-bottom: 2px; }
        .upgrade-desc { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; }
        .upgrade-level { font-size: 0.7rem; color: var(--accent-magenta); font-weight: 600; }
        .upgrade-cost { text-align: right; min-width: 70px; }
        .upgrade-cost .cost-value { font-size: 0.95rem; font-weight: 700; color: var(--accent-cyan); display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
        .upgrade-cost .cost-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
        .upgrade-card .glow-bg {
            position: absolute; top: -50%; right: -30%; width: 80%; height: 200%;
            background: radial-gradient(ellipse, rgba(0,255,255,0.1) 0%, transparent 70%);
            pointer-events: none; transition: opacity 0.3s ease; opacity: 0;
        }
        .upgrade-card.affordable .glow-bg { opacity: 1; }

        /* Conquistas */
        #achievementsList { display: grid; grid-template-columns: 1fr; gap: 6px; }
        .achievement-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .achievement-card.unlocked { border-color: rgba(255,215,0,0.6); background: rgba(255,215,0,0.1); box-shadow: 0 0 16px rgba(255,215,0,0.2); }
        .achievement-card.locked { opacity: 0.45; }
        .achievement-icon { font-size: 1.5rem; }
        .achievement-info .ach-name { font-size: 0.82rem; font-weight: 700; color: var(--text-primary); }
        .achievement-info .ach-desc { font-size: 0.7rem; color: var(--text-secondary); }

        /* Prestígio */
        #prestigePanel { display: flex; flex-direction: column; gap: 12px; }
        .prestige-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .prestige-title { font-size: 1.2rem; font-weight: 700; color: var(--accent-gold); margin-bottom: 8px; }
        .prestige-desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px; }
        .prestige-gain { font-size: 1.5rem; font-weight: 700; color: var(--accent-cyan); margin: 10px 0; }
        .prestige-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a1a; border: none; border-radius: var(--radius);
            padding: 14px 24px; font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: all 0.25s ease; font-family: var(--font); letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(255,215,0,0.4);
        }
        .prestige-btn:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(255,215,0,0.3); }
        .prestige-btn:disabled { background: var(--bg-card); color: var(--text-dim); cursor: not-allowed; box-shadow: none; border: 1px solid var(--border-color); }
        .prestige-bonus-display { font-size: 0.85rem; color: var(--accent-green); font-weight: 600; margin-top: 8px; }

        /* Stats */
        #statsPanel { display: flex; flex-direction: column; gap: 8px; }
        .stat-row {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            backdrop-filter: blur(4px);
        }
        .stat-row .stat-label { color: var(--text-secondary); }
        .stat-row .stat-value { font-weight: 700; color: var(--text-primary); }

        /* Gacha */
        #gachaPanel { display: flex; flex-direction: column; gap: 12px; }
        .gacha-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .gacha-title { font-size: 1.3rem; font-weight: 700; color: var(--accent-magenta); margin-bottom: 8px; }
        .gacha-desc { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; }
        .gacha-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .gacha-btn {
            background: linear-gradient(135deg, #ff00ff, #8800aa);
            color: #fff; border: none; border-radius: var(--radius-sm);
            padding: 12px 20px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; font-family: var(--font);
            box-shadow: 0 4px 16px rgba(255,0,255,0.3);
        }
        .gacha-btn:active { transform: scale(0.94); }
        .gacha-btn:disabled { background: var(--bg-card); color: var(--text-dim); cursor: not-allowed; box-shadow: none; border: 1px solid var(--border-color); }
        .gacha-collection { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
        .gacha-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xs);
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .gacha-item .level { color: var(--accent-gold); font-weight: 700; }
        .gacha-bonus { font-size: 0.85rem; color: var(--accent-green); margin-top: 8px; font-weight: 600; }

        /* Inventário */
        #inventoryPanel { display: flex; flex-direction: column; gap: 12px; }
        .inventory-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .inventory-title { font-size: 1.1rem; font-weight: 700; color: var(--accent-gold); margin-bottom: 10px; text-align: center; }
        .equipped-slots { display: flex; gap: 12px; justify-content: center; margin-bottom: 12px; }
        .equipped-slot {
            width: 80px; height: 100px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-dim);
            background: rgba(0,0,0,0.2);
        }
        .equipped-slot .item-icon { font-size: 2rem; }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }
        .inventory-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xs);
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .inventory-item:hover { background: var(--bg-card-hover); }
        .inventory-item.equipped { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0,255,255,0.3); }
        .inventory-item .item-rarity { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
        .inventory-item .item-icon { font-size: 1.8rem; }
        .inventory-item .item-name { font-size: 0.7rem; font-weight: 600; color: var(--text-primary); }
        .inventory-item .item-bonus { font-size: 0.65rem; color: var(--text-secondary); }
        .sell-btn {
            display: block;
            margin-top: 4px;
            padding: 2px 6px;
            font-size: 0.6rem;
            background: var(--accent-red);
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            width: 100%;
        }
        .rarity-common { color: #aaaaaa; }
        .rarity-rare { color: #00aaff; }
        .rarity-epic { color: #aa00ff; }
        .rarity-legendary { color: #ffaa00; }
        .rarity-mythic { color: #ff00ff; }

        /* Contratos */
        .contract-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }
        .contract-card.completed {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }
        .contract-card.claimed {
            border-color: var(--accent-green);
            background: rgba(0,255,136,0.05);
        }
        .claim-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: var(--radius-xs);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
            font-family: var(--font);
        }
        .claim-btn:active { transform: scale(0.94); }
        .claim-btn:disabled { background: var(--bg-card); color: var(--text-dim); cursor: not-allowed; }

        /* Rumores */
        .rumor-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 8px;
        }

        .rumor-card.unlocked { border-color: var(--accent-gold); background: rgba(255,215,0,0.1); }
        .rumor-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .rumor-hint { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 6px; }
        .rumor-progress { font-size: 0.7rem; color: var(--accent-cyan); }

        /* NPC Dialog */
        .npc-dialog {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,40,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,215,0,0.5);
            border-radius: var(--radius);
            padding: 16px 20px;
            z-index: 400;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastIn 0.4s ease;
            max-width: 90%;
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }
        .npc-dialog .npc-icon { font-size: 2rem; }
        .npc-dialog .npc-text { font-size: 0.85rem; color: var(--text-primary); line-height: 1.4; flex: 1; }
        .npc-dialog .npc-close {
            background: none; border: none; color: var(--text-dim);
            font-size: 1.2rem; cursor: pointer; padding: 4px;
        }
        .npc-dialog.hidden { display: none; }

        #toastContainer {
            position: fixed; top: 80px; right: 12px; z-index: 200;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 300px;
        }
        .toast {
            background: rgba(20,20,40,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,215,0,0.5);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            display: flex; align-items: center; gap: 10px;
            animation: toastIn 0.4s ease, toastOut 0.4s ease 3s forwards;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.2);
            pointer-events: auto;
        }
        .toast-icon { font-size: 1.6rem; }
        .toast-text { font-size: 0.78rem; font-weight: 600; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(50px); } }

        #modalOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 300;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        #modalOverlay.hidden { display: none; }
        #modal {
            background: var(--bg-secondary);
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: var(--radius); padding: 24px 20px;
            max-width: 360px; width: 90%; text-align: center;
            box-shadow: 0 0 50px rgba(255,215,0,0.2), 0 20px 60px rgba(0,0,0,0.6);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        #modal h3 { font-size: 1.2rem; color: var(--accent-gold); margin-bottom: 10px; }
        #modal p { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-btn { padding: 10px 18px; border-radius: var(--radius-sm); border: none; font-weight: 700; cursor: pointer; font-family: var(--font); font-size: 0.85rem; transition: all 0.2s ease; }
        .modal-btn.confirm { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a1a; }
        .modal-btn.cancel { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .modal-btn:active { transform: scale(0.94); }

        .sound-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 50%; width: 36px; height: 36px; font-size: 1rem;
            cursor: pointer; color: var(--text-primary); display: flex;
            align-items: center; justify-content: center; flex: 0 0 auto;
            transition: all 0.2s; backdrop-filter: blur(4px);
        }
        .sound-btn:active { transform: scale(0.9); }
        #header { display: flex; flex-direction: column; gap: 8px; }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .header-top .stats-row { flex: 1 1 auto; flex-wrap: wrap; }

        @media (min-width: 480px) {
            #crystalButton { width: 160px; height: 160px; font-size: 4.8rem; }
            #crystalWrapper { width: 230px; height: 230px; }
            #crystalWrapper::before { width: 200px; height: 200px; }
            #crystalWrapper::after { width: 270px; height: 270px; }
            .stat-item { font-size: 0.9rem; padding: 8px 16px; }
            .stat-item .value { font-size: 1.05rem; }
        }
        @media (min-width: 768px) {
            #main { max-width: 700px; padding: 24px 20px 16px; gap: 16px; }
            #crystalArea { min-height: 320px; }
            #crystalButton { width: 180px; height: 180px; font-size: 5.2rem; }
            #crystalWrapper::before { width: 220px; height: 220px; }
            #crystalWrapper::after { width: 300px; height: 300px; }
            .tab { font-size: 0.85rem; padding: 12px 10px; }
            .upgrade-card { padding: 16px 18px; }
            .upgrade-icon { font-size: 2.2rem; }
            .upgrade-name { font-size: 0.95rem; }
            .upgrade-desc { font-size: 0.8rem; }
            #achievementsList { grid-template-columns: 1fr 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        /* ===== PARTE 3: TEMA FUTURISTA (era-future) ===== */
        body.era-future {
            --accent-gold: #00e5ff;
            --accent-purple: #b14bff;

            color: #fff;
        }
        body.era-future .prestige-btn { background: linear-gradient(135deg, #7b2ff7, #00e0ff); color: #fff; }

            // ===== ESTADO =====
            function createEraState(era = 'present') {

                    crystals: 0,

            // ===== VARIÁVEIS GLOBAIS =====

            // ===== POOL DE PARTÍCULAS E TEXTOS =====

            // ===== HELPERS =====
            function getCurrentItemsDefs() {
                if (state.era === 'past') return ITEMS_DEFS_PAST;
                if (state.era === 'future') return ITEMS_DEFS_FUTURE;
                return ITEMS_DEFS;
            }

            function getCurrentUpgradesDefs() {
                if (state.era === 'past') return UPGRADES_DEFS_PAST;
                if (state.era === 'future') return UPGRADES_DEFS_FUTURE;
                return UPGRADES_DEFS;
            }

            function getItemDef(itemId) {
                return getCurrentItemsDefs().find(d => d.id === itemId);
            }

            function getLevel(totalCrystals) { return 1 + Math.floor(Math.sqrt(totalCrystals / 1000)); }
            function getLevelProgress(totalCrystals) {
                const level = getLevel(totalCrystals);
                const currentLevelXp = 1000 * Math.pow(level - 1, 2);
                const nextLevelXp = 1000 * Math.pow(level, 2);
                const denom = nextLevelXp - currentLevelXp;
                if (denom <= 0) return 0;
                return Math.max(0, Math.min(1, (totalCrystals - currentLevelXp) / denom));
            }
            function getLevelBonus(level) { return (level - 1) * 0.05; }
            function getPrestigeBonus(prestigePoints) { return prestigePoints * PRESTIGE_BONUS_PER_POINT; }
            function getTemporalFragmentBonus() { return state.temporalFragments * TEMPORAL_FRAGMENT_BONUS; }
            // ===== PARTE 3: Fragmentos da Realidade (Fr) e Ascensão Cósmica =====
            function getRealityFragmentBonus() { return (state.realityFragments || 0) * REALITY_FRAGMENT_BONUS; }
            function getCosmicAscensionBonus() { return (state.cosmicAscensions || 0) * COSMIC_ASCENSION_BONUS; }

            // Retorno decrescente para o pool de %: compõe bônus crus altos sem estourar.
            // K controla o ponto de joelho; tanh é contínua e sempre crescente (nunca trava o jogador).
            function softCapPercent(x) {
                const K = 5;
                if (!Number.isFinite(x)) return 0;
                return K * Math.tanh(x / K);
            }

            function getTotalMultiplier() {
                const levelBonus = getLevelBonus(getLevel(state.totalCrystals));
                const prestigeBonus = getPrestigeBonus(state.prestigePoints);
                const temporalBonus = getTemporalFragmentBonus();
                const realityBonus = getRealityFragmentBonus();
                const ascensionBonus = getCosmicAscensionBonus();
                let extraBonus = 0;
                if (state.temporalUpgrades) {
                    if (state.temporalUpgrades.temp_prod_both) extraBonus += state.temporalUpgrades.temp_prod_both * 0.10;
                    if (state.temporalUpgrades.temp_click_both) extraBonus += state.temporalUpgrades.temp_click_both * 0.15;
                }
                if (state.realityUpgrades) {
                    if (state.realityUpgrades.real_prod_both) extraBonus += state.realityUpgrades.real_prod_both * 0.10; // +10% produção (todas as eras)
                    if (state.realityUpgrades.real_fr_gain) extraBonus += state.realityUpgrades.real_fr_gain * 0.05;       // +5% Fr por Ascensão
                    if (state.realityUpgrades.real_golden) extraBonus += state.realityUpgrades.real_golden * 0.05;        // +5% chance golden (futuro)
                }
                // Soma bruta de todos os bônus aditivos do multiplicador global.
                const rawBonus = levelBonus + prestigeBonus + temporalBonus + realityBonus + ascensionBonus + extraBonus;
                // Retorno decrescente: aproxima de um teto macio (SOFT_CAP) sem travar o jogador.
                const SOFT_CAP = 1000;
                const effBonus = SOFT_CAP * Math.tanh(rawBonus / SOFT_CAP);
                return (1 + effBonus);
            }

            // Sistema híbrido: soma absoluta (base) + percentual aplicado sobre a base,
            // depois o multiplicador global (nível/prestígio/temporal) é aplicado por cima.
            function getClickPower() {
                let base = 1;
                let percent = 0;

                for (const def of getCurrentUpgradesDefs()) {
                    if (def.type !== 'click') continue;
                    const level = state.upgrades[def.id] || 0;
                    if (!level) continue;
                    if (def.percent) {
                        percent += def.percent * level;
                    } else if (def.value) {
                        base += def.value * level;
                    }
                }

                for (const uid of state.equippedSlots) {
                    if (!uid) continue;
                    const invItem = state.inventory.find(item => item.uid === uid);
                    if (!invItem) continue;
                    const def = getItemDef(invItem.itemId);
                    if (!def || def.type !== 'click') continue;
                    base += def.baseBonus || 0;
                    percent += def.percentBonus || 0;
                }

                const total = base * (1 + softCapPercent(percent));
                const result = Math.floor(total * getTotalMultiplier());
                return Number.isFinite(result) ? result : 0;
            }

            function getAutoPower() {
                let base = 0;
                let percent = 0;

                for (const def of getCurrentUpgradesDefs()) {
                    if (def.type !== 'auto') continue;
                    const level = state.upgrades[def.id] || 0;
                    if (!level) continue;
                    if (def.percent) {
                        percent += def.percent * level;
                    } else if (def.value) {
                        base += def.value * level;
                    }
                }

                for (const uid of state.equippedSlots) {
                    if (!uid) continue;
                    const invItem = state.inventory.find(item => item.uid === uid);
                    if (!invItem) continue;
                    const def = getItemDef(invItem.itemId);
                    if (!def || def.type !== 'auto') continue;
                    base += def.baseBonus || 0;
                    percent += def.percentBonus || 0;
                }

                const total = base * (1 + softCapPercent(percent));
                const result = Math.floor(total * getTotalMultiplier());
                return Number.isFinite(result) ? result : 0;
            }

            function getUpgradeCost(def) {
                const level = state.upgrades[def.id] || 0;
                const cost = def.baseCost * Math.pow(def.costMult, level);
                if (!Number.isFinite(cost) || cost > Number.MAX_SAFE_INTEGER) return Number.MAX_SAFE_INTEGER;
                return Math.floor(cost);
            }

            function getPrestigeGain() {
                if (state.totalCrystals < 100000) return 0;
                const g = Math.pow(state.totalCrystals / 100000, 0.7);
                return Number.isFinite(g) ? Math.min(Math.floor(g), 5e6) : 0;
            }

            function getPrestigeGainPast() {
                if (state.totalCrystals < 100000) return 0;
                const g = Math.pow(state.totalCrystals / 100000, 0.6) * 1.5;
                return Number.isFinite(g) ? Math.min(Math.floor(g), 5e6) : 0;
            }

            function isItemEquipped(uid) { return state.equippedSlots.includes(uid); }
            function canEquip() { return state.equippedSlots.filter(uid => uid !== null).length < MAX_EQUIPPED; }

            function equipItem(uid) {
                const invItem = state.inventory.find(item => item.uid === uid);
                if (!invItem) {
                    showToast('⚠️', 'Item não encontrado no inventário.');
                    return;
                }
                if (isItemEquipped(uid)) return;
                if (!canEquip()) {
                    showToast('⚠️', 'Você já tem 2 itens equipados! Desequipe um para equipar outro.');
                    return;
                }
                const emptySlot = state.equippedSlots.indexOf(null);
                if (emptySlot === -1) return;
                state.equippedSlots[emptySlot] = uid;
                invItem.equipped = true;
                needsRenderInventory = true;
                updateDisplay();
                saveGameDebounced();
            }

            function unequipItem(uid) {
                const slotIndex = state.equippedSlots.indexOf(uid);
                if (slotIndex === -1) return;
                state.equippedSlots[slotIndex] = null;
                const invItem = state.inventory.find(item => item.uid === uid);
                if (invItem) invItem.equipped = false;
                needsRenderInventory = true;
                updateDisplay();
                saveGameDebounced();
            }

            function toggleEquip(uid) {
                if (isItemEquipped(uid)) unequipItem(uid);
                else equipItem(uid);
            }

            function addItemToInventory(itemId) {
                if (state.inventory.length >= MAX_INVENTORY_SIZE) {
                    showToast('⚠️', 'Inventário cheio! Venda ou descarte itens para obter novos.');
                    return false;
                }
                const newItem = { uid: state.nextUid++, itemId: itemId, equipped: false };
                state.inventory.push(newItem);
                needsRenderInventory = true;
                return true;
            }

            function getSellValue(rarity) {
                switch(rarity) {
                    case 'common': return 1;
                    case 'rare': return 5;
                    case 'epic': return 15;
                    case 'legendary': return 40;
                    case 'mythic': return 80;
                    default: return 1;
                }
            }

            function sellItem(uid) {
                const idx = state.inventory.findIndex(item => item.uid === uid);
                if (idx === -1) return;
                const invItem = state.inventory[idx];
                const def = getItemDef(invItem.itemId);
                if (def) {
                    const slotIndex = state.equippedSlots.indexOf(uid);
                    if (slotIndex !== -1) {
                        state.equippedSlots[slotIndex] = null;
                        invItem.equipped = false;
                    }
                    state.inventory.splice(idx, 1);
                    const coinValue = getSellValue(def.rarity);
                    state.gachaCoins += coinValue;
                    showToast('🪙', `Item vendido por ${coinValue} Gacha Coins.`);
                    needsRenderInventory = true;
                    needsRenderGacha = true;
                    updateDisplay();
                    saveGameDebounced();
                }
            }

            function sellAllByRarity(rarity) {
                let total = 0, count = 0;
                const toSell = state.inventory.filter(item => {
                    const def = getItemDef(item.itemId);
                    if (!def || def.rarity !== rarity) return false;
                    if (isItemEquipped(item.uid)) return false;
                    // Não vender itens especiais/míticos rastreados.
                    if (def.source === 'special' || def.source === 'mythic') return false;
                    return true;
                });
                for (const item of toSell) {
                    const idx = state.inventory.indexOf(item);
                    if (idx === -1) continue;
                    const def = getItemDef(item.itemId);
                    state.inventory.splice(idx, 1);
                    total += getSellValue(def.rarity);
                    count++;
                }
                if (count === 0) {
                    showToast('⚠️', 'Nenhum item comum disponível para vender.');
                    return;
                }
                state.gachaCoins += total;
                showToast('🪙', `${count} itens vendidos por ${total} Gacha Coins.`);
                needsRenderInventory = true;
                needsRenderGacha = true;
                updateDisplay();
                saveGameDebounced();
            }

            // BUG FIX #2: itens especiais/míticos agora são rastreados permanentemente em
            // ownedSpecialItems, independente de estarem ou não no inventário. Isso evita
            // o exploit de vender e reobter o item infinitamente a cada tick.
            function checkSpecialItems() {
                if (!Array.isArray(state.ownedSpecialItems)) state.ownedSpecialItems = [];
                for (const def of getCurrentItemsDefs()) {
                    if (def.source === 'special' || def.source === 'mythic') {
                        const alreadyOwned = state.ownedSpecialItems.includes(def.id);
                        if (!alreadyOwned && def.unlockCondition(state)) {
                            if (state.inventory.length >= MAX_INVENTORY_SIZE) {
                                showToast('⚠️', `Inventário cheio! Não foi possível obter ${def.name}.`);
                                continue;
                            }
                            if (addItemToInventory(def.id)) {
                                state.ownedSpecialItems.push(def.id);
                                showToast('🎁', `Item especial obtido: ${def.name}!`);
                            }
                        }
                    }
                }
                needsRenderInventory = true;
            }

            function grantGachaCoins(amount, reason = '') {
                if (amount <= 0) return;
                state.gachaCoins += amount;
                needsRenderGacha = true;
                updateDisplay();
                if (reason) showToast('🪙', `+${amount} Gacha Coins (${reason})`);
                saveGameDebounced();
            }

            function resetDailyProgressIfNeeded() {
                const today = new Date().toLocaleDateString('en-CA');
                if (state.dailyContractDate !== today) {
                    state.dailyContractDate = today;
                    state.dailyContracts = DAILY_CONTRACTS_DEFS.map(c => ({ id: c.id, completed: false, claimed: false }));
                    state.luckyFragments = 0;
                    state.dailyStats = { clicks: 0, crystals: 0, golden: 0, upgrades: 0 };
                    needsRenderContracts = true;
                    saveGameDebounced();
                }
            }

            function checkDailyContracts() {
                resetDailyProgressIfNeeded();
                for (let i = 0; i < DAILY_CONTRACTS_DEFS.length; i++) {
                    const def = DAILY_CONTRACTS_DEFS[i];
                    const contract = state.dailyContracts.find(c => c.id === def.id);
                    if (!contract || contract.claimed) continue;
                    if (def.check(state) && !contract.completed) {
                        contract.completed = true;
                        showToast('✅', `Contrato concluído: ${def.desc}! Reivindique sua recompensa.`);
                        needsRenderContracts = true;
                    }
                }
                if (needsRenderContracts) renderContracts();
            }

            function claimContract(id) {
                const contract = state.dailyContracts.find(c => c.id === id);
                if (!contract) return;
                const def = DAILY_CONTRACTS_DEFS.find(d => d.id === id);
                if (!def) return;
                if (!contract.completed || contract.claimed) return;
                contract.claimed = true;
                grantGachaCoins(def.reward, `Contrato: ${def.desc}`);
                needsRenderContracts = true;
                renderContracts();
                updateDisplay();
                saveGameDebounced();
            }

            function tryDropLuckyFragment() {
                if (state.luckyFragments >= 20) return;
                if (Math.random() < 0.005) {
                    state.luckyFragments += 1;
                    showToast('🍀', '+1 Fragmento de Sorte!');
                    if (state.luckyFragments >= 10) {
                        state.luckyFragments -= 10;
                        grantGachaCoins(1, '10 Fragmentos de Sorte');
                    } else {
                        saveGameDebounced();
                    }
                }
            }

            function checkAchievements() {
                ensureAchievements(state);
                let newUnlocks = [];
                for (const ach of ACHIEVEMENTS_DEFS) {
                    if (!state.achievements[ach.id] && ach.check(state)) {
                        state.achievements[ach.id] = true;
                        newUnlocks.push(ach);
                    }
                }
                if (newUnlocks.length > 0) {
                    playAchievementSound();
                    for (const ach of newUnlocks) {
                        showToast(ach.icon, 'Conquista: ' + ach.name + '!');
                        grantGachaCoins(3, ach.name);
                    }
                    needsRenderAchievements = true;
                    renderAchievements();
                    updateDisplay();
