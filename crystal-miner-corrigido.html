            function addCrystalsAndProgress(amount) {
                state.crystals += amount;
                state.totalCrystals += amount;
                state.lifetimeTotalCrystals += amount;
                state.dailyStats.crystals += amount;
            }

            // ===== DICAS (HINTS) =====
            function getProgressForItem(itemDef, s) {
                if (itemDef.id === 'obsidian_pick') return Math.min(s.lifetimeTotalClicks / 10000, 1);
                if (itemDef.id === 'quantum_miner') return Math.min(s.lifetimeTotalCrystals / 50000000, 1);
                if (itemDef.id === 'stellar_blade') return Math.min(s.prestigeCount / 5, 1);
                if (itemDef.id === 'singularity_core') return Math.min(s.lifetimeGoldenCrystalsCaught / 100, 1);
                if (itemDef.id === 'creator_hammer') {
                    const progressClicks = Math.min(s.lifetimeTotalClicks / 5000, 1);
                    const progressPrestige = Math.min(s.prestigeCount / 8, 1);
                    const progressItems = s.inventory.some(item => item.itemId === 'antimatter_extractor' || item.itemId === 'infinite_energy') ? 1 : 0;
                    return Math.min(progressClicks, progressPrestige, progressItems);
                }
                if (itemDef.id === 'eternity_heart') {
                    const progressCrystals = Math.min(s.lifetimeTotalCrystals / 100000000, 1);
                    const progressGolden = Math.min(s.goldenCrystalsCaught / 200, 1);
                    const progressUpgrades = Math.min(s.lifetimeUpgrades / 100, 1);
                    return Math.min(progressCrystals, progressGolden, progressUpgrades);
                }
                if (itemDef.id === 'ancestral_wisdom') {
                    return Math.min((s.prestigeCountPast || 0) / 3, 1);
                }
                return null;
            }

            function checkHints() {
                if (state.era === 'present') {
                    for (const def of ITEMS_DEFS) {
                        if (!def.hints || !def.unlockCondition) continue;
                        const alreadyOwned = state.inventory.some(item => item.itemId === def.id);
                        if (alreadyOwned) continue;
                        const progress = getProgressForItem(def, state);
                        if (progress === null) continue;
                        for (const hint of def.hints) {
                            const hintKey = def.id + '_' + hint.progress;
                            if (progress >= hint.progress && !state.hintsSeen[hintKey]) {
                                state.hintsSeen[hintKey] = true;
                                showNPCDialog(hint.text);
                                saveGameDebounced();
                                break;
                            }
                        }
                    }
                } else if (state.era === 'past') {
                    for (const def of ITEMS_DEFS_PAST) {
                        if (!def.hints || !def.unlockCondition) continue;
                        const alreadyOwned = state.inventory.some(item => item.itemId === def.id);
                        if (alreadyOwned) continue;
                        const progress = getProgressForItem(def, state);
                        if (progress === null) continue;
                        for (const hint of def.hints) {
                            const hintKey = def.id + '_' + hint.progress;
                            if (progress >= hint.progress && !state.hintsSeen[hintKey]) {
                                state.hintsSeen[hintKey] = true;
                                showNPCDialog(hint.text);
                                saveGameDebounced();
                                break;
                            }
                        }
                    }
                }
            }

            function showNPCDialog(text) {
                npcDialogTextEl.textContent = text;
                npcDialogEl.classList.remove('hidden');
                if (npcDialogTimeout) clearTimeout(npcDialogTimeout);
                npcDialogTimeout = setTimeout(() => {
                    npcDialogEl.classList.add('hidden');
                    npcDialogTimeout = null;
                }, 6000);
            }

            // ===== AÇÕES =====
            function clickCrystal(e) {
                const now = Date.now();
                if (now - lastClickTime < 50) return;
                lastClickTime = now;
                const clickPower = getClickPower();
                const goldenActive = state.goldenCrystalActive;
                const gain = goldenActive ? clickPower * 5 : clickPower;
                addCrystalsAndProgress(gain);
                state.totalClicks += 1;
                state.lifetimeTotalClicks += 1;
                state.dailyStats.clicks += 1;
                safeVibrate(goldenActive ? 20 : 8);
                createParticles(e, goldenActive ? 5 : 3, goldenActive);
                createFloatingText(e, '+' + gain, goldenActive);
                crystalButtonEl.style.transform = 'scale(0.9)';
                setTimeout(() => { crystalButtonEl.style.transform = ''; }, 80);
                throttledPlayClickSound(goldenActive);
                tryDropLuckyFragment();
                // As verificações pesadas (achievements, itens especiais, hints) são
                // executadas no game loop a cada ~1s, não a cada clique (BUG FIX #4).
                updateDisplay();
                // Não salvar a cada clique.
            }

            function clickGoldenCrystal(e) {
                e.stopPropagation();
                state.goldenCrystalsCaught += 1;
                state.lifetimeGoldenCrystalsCaught += 1;
                state.dailyStats.golden += 1;
                const bonusAmount = Math.floor(getAutoPower() * 30) + getClickPower() * 20;
                addCrystalsAndProgress(bonusAmount);
                const coinReward = Math.floor(Math.random() * 4) + 2;
                grantGachaCoins(coinReward, 'Cristal Dourado');
                createParticles(e, 8, true);
                createFloatingText(e, '🌟+' + bonusAmount, true);
                playGoldenSound();
                hideGoldenCrystal();
                checkAchievements();
                checkSpecialItems();
                checkHints();
                updateDisplay();
                saveGameDebounced();
            }

            function buyUpgrade(id) {
                const def = getCurrentUpgradesDefs().find(u => u.id === id);
                if (!def) return;
                if (!def.unlock(state)) return;
                if (def.maxLevel !== undefined && (state.upgrades[id] || 0) >= def.maxLevel) {
                    showToast('🔒', `${def.name} já está no nível máximo (${def.maxLevel}).`);
                    return;
                }
                const cost = getUpgradeCost(def);
                if (state.crystals < cost) return;
                state.crystals -= cost;
                state.upgrades[id] = (state.upgrades[id] || 0) + 1;
                state.totalUpgrades += 1;
                state.lifetimeUpgrades += 1;
                state.dailyStats.upgrades += 1;
                playBuySound();
                const cardElement = document.querySelector(`[data-upgrade-id="${id}"]`);
                if (cardElement) {
                    const rect = cardElement.getBoundingClientRect();
                    createFloatingTextAt(rect.left + rect.width / 2, rect.top, '-' + cost, false, '#ff6666');
                    cardElement.classList.add('purchased');
                    setTimeout(() => cardElement.classList.remove('purchased'), 300);
                } else {
                    const rect = crystalButtonEl.getBoundingClientRect();
                    createFloatingTextAt(rect.left + rect.width / 2, rect.top + rect.height / 2 - 30, '-' + cost, false, '#ff6666');
                }
                needsRenderUpgrades = true;
                checkAchievements();
                checkSpecialItems();
                checkHints();
                updateDisplay();
                updateUpgradesAffordability();
                saveGameDebounced();
            }

            function doPrestige() {
                const gain = getPrestigeGain();
                if (gain <= 0) return;
                state.prestigePoints += gain;
                state.prestigeCount += 1;
                const prestigeCoins = 20 + state.prestigeCount * 5;
                state.crystals = 0;
                state.totalCrystals = 0;
                state.totalClicks = 0;
                state.totalUpgrades = 0;
                state.upgrades = Object.fromEntries(getCurrentUpgradesDefs().map(u => [u.id, 0]));
                state.autoAccumulator = 0;
                // BUG FIX #3: goldenCrystalsCaught é resetado no prestígio para impedir que
                // itens/conquistas que dependem desse contador continuem acumulando indefinidamente
                // entre resets (prestigeCount permanece intacto, pois é o marcador correto de progresso).
                state.goldenCrystalsCaught = 0;
                hideGoldenCrystal();
                playPrestigeSound();
                grantGachaCoins(prestigeCoins, 'Prestígio');
                showToast('🌟', `Prestígio realizado! +${gain} Fragmentos de Eternidade! Bônus total: +${Math.floor(getPrestigeBonus(state.prestigePoints)*100)}%`);
                needsRenderUpgrades = true;
                needsRenderPrestige = true;
                checkAchievements();
                checkSpecialItems();
                updateDisplay();
                saveGameDebounced();
            }

            function doPrestigePast() {
                const gain = getPrestigeGainPast();
                if (gain <= 0) return;
                state.temporalFragments += gain;
                state.prestigeCountPast = (state.prestigeCountPast || 0) + 1;
                state.crystals = 0;
                state.totalCrystals = 0;
                state.totalClicks = 0;
                state.totalUpgrades = 0;
                state.upgrades = Object.fromEntries(getCurrentUpgradesDefs().map(u => [u.id, 0]));
                state.autoAccumulator = 0;
                // BUG FIX #3 (equivalente na era passada)
                state.goldenCrystalsCaught = 0;
                hideGoldenCrystal();
                playPrestigeSound();
                showToast('🌀', `Prestígio Temporal! +${gain} Fragmentos Temporais!`);
                needsRenderUpgrades = true;
                needsRenderPrestige = true;
                checkAchievements();
                checkSpecialItems();
                updateDisplay();
                saveGameDebounced();
            }

            // ===== PARTE 3: PRESTÍGIO DA REALIDADE (ganha Fr) e ASCENSÃO CÓSMICA (gasta Fr) =====
            function getRealityGain() {
                if (state.totalCrystals < 100000) return 0;
                const g = Math.pow(state.totalCrystals / 100000, 0.65);
                return Number.isFinite(g) ? Math.min(Math.floor(g), REALITY_PRESTIGE_CAP) : 0;
            }

            function doRealityPrestige() {
                const gain = getRealityGain();
                if (gain <= 0) return;
                state.cosmicAscensions += 1;
                state.realityFragments += gain;
                // Reset do progresso da era do futuro (Fr e Ascensões permanecem).
                state.crystals = 0;
                state.totalCrystals = 0;
                state.totalClicks = 0;
                state.totalUpgrades = 0;
                state.upgrades = Object.fromEntries(getCurrentUpgradesDefs().map(u => [u.id, 0]));
                state.autoAccumulator = 0;
                state.goldenCrystalsCaught = 0;
                hideGoldenCrystal();
                playPrestigeSound();
                showToast('🌌', `Prestígio da Realidade! +${gain} Fragmentos da Realidade! (Ascensão Cósmica #${state.cosmicAscensions})`);
                needsRenderUpgrades = true;
                needsRenderPrestige = true;
                checkAchievements();
                checkSpecialItems();
                updateDisplay();
                saveGameDebounced();
            }

            function getCosmicAscensionCost(level) {
                return Math.floor(1000 * Math.pow(3, level));
            }

            function buyCosmicAscension() {
                if (state.era !== 'future') return;
                const level = state.cosmicAscensions || 0;
                const cost = getCosmicAscensionCost(level);
                if (state.realityFragments < cost) return;
                state.realityFragments -= cost;
                state.cosmicAscensions = level + 1;
                showToast('🌟', `Ascensão Cósmica #${state.cosmicAscensions}! Bônus global +${Math.floor(COSMIC_ASCENSION_BONUS * 100)}%`);
                needsRenderPrestige = true;
                updateDisplay();
                saveGameDebounced();
            }

            function buyRealityUpgrade(id) {
                const def = REALITY_UPGRADES_DEFS.find(t => t.id === id);
                if (!def) return;
                const level = state.realityUpgrades?.[id] || 0;
                const cost = Math.floor(def.baseCost * Math.pow(def.costMult, level));
                if (state.realityFragments < cost) return;
                state.realityFragments -= cost;
                if (!state.realityUpgrades) state.realityUpgrades = {};
                state.realityUpgrades[id] = level + 1;
                showToast('🛸', `Melhoria da Realidade comprada: ${def.name}!`);
                needsRenderPrestige = true;
                updateDisplay();
                saveGameDebounced();
            }

            function pullGacha(amount) {
                const isTen = amount === 10;
                const cost = isTen ? GACHA_COST_TEN : GACHA_COST_SINGLE;
                const pulls = isTen ? 11 : 1;

                if (state.inventory.length + pulls > MAX_INVENTORY_SIZE) {
                    showToast('⚠️', 'Inventário cheio! Libere espaço antes de puxar.');
                    return;
                }
                if (state.gachaCoins < cost) return;

                state.gachaCoins -= cost;
                state.gachaPulls += pulls;
                let results = [];
                for (let i = 0; i < pulls; i++) {
                    const rarity = performGachaPull();
                    const item = getRandomItemByRarity(rarity);
                    if (item) {
                        if (addItemToInventory(item.id)) {
                            results.push({ item, rarity });
                        }
                    } else {
                        const fallback = getCurrentItemsDefs().find(i => i.source === 'gacha' && i.rarity === 'common');
                        if (fallback && addItemToInventory(fallback.id)) {
                            results.push({ item: fallback, rarity: 'common' });
                        }
                    }
                }
                if (results.length > 0) {
                    let itemNames = results.map(r => `${r.item.icon} ${r.item.name}`).join(', ');
                    showToast('🎰', `Pull${pulls > 1 ? 's' : ''}: ${itemNames}`);
                }
                needsRenderGacha = true;
                needsRenderInventory = true;
                renderGacha();
                renderInventory();
                checkAchievements();
                updateDisplay();
                saveGameDebounced();
            }

            function performGachaPull() {
                state.pityCounter += 1;
                let rarity;
                if (state.pityCounter >= GACHA_PITY_LIMIT) {
                    rarity = 'epic';
                    state.pityCounter = 0;
                } else {
                    const roll = Math.random() * 100;
                    if (roll < 0.3) rarity = 'legendary';
                    else if (roll < 4) rarity = 'epic';
                    else if (roll < 30) rarity = 'rare';
                    else rarity = 'common';
                    if (rarity === 'epic' || rarity === 'legendary') state.pityCounter = 0;
                }
                return rarity;
            }

            function getRandomItemByRarity(rarity) {
                const pool = getCurrentItemsDefs().filter(item => item.source === 'gacha' && item.rarity === rarity);
                if (pool.length === 0) return null;
                return pool[Math.floor(Math.random() * pool.length)];
            }

            // ===== VIAGEM NO TEMPO =====
            function canTimeTravel() {
                if (state.era === 'past') return true;
                return state.prestigeCount >= 10 &&
                       state.inventory.some(item => item.itemId === 'eternity_heart') &&
                       state.lifetimeGoldenCrystalsCaught >= 100 &&
                       state.lifetimeTotalCrystals >= 10000000;
            }

            function travelToPast() {
                if (state.era !== 'present' || !canTimeTravel()) return;
                saveCurrentStateToEra('present');
                loadStateFromEra('past');
                state.era = 'past';
                state.timeTravelCount += 1;
                showToast('🌀', 'Você viajou para o passado! Bem-vindo à Era Primordial.');
                if (state.era === 'past') checkFutureQuest();
                needsRenderUpgrades = true;
                needsRenderAchievements = true;
                needsRenderGacha = true;
                needsRenderPrestige = true;
                needsRenderInventory = true;
                needsRenderContracts = true;
                needsRenderRumors = true;
                needsRenderPortal = true;
                updateDisplay();
                renderAll();
                scheduleGoldenCrystal();
                saveGameDebounced();
            }

            // ===== PARTE 3: CADEIA DE 7 PASSOS (PASSADO) PARA LIBERAR O FUTURO =====
            // Definição ordenada dos passos. Cada step avalia estado do PASSADO.
            function getFutureQuestSteps() {
                return [
                    { id: 1, label: 'Faça 1 Prestígio na Era Primordial', check: (s) => s.prestigeCountPast >= 1, current: (s) => s.prestigeCountPast, target: 1 },
                    { id: 2, label: 'Acumule 1e9 cristais no passado', check: (s) => s.totalCrystals >= 1e9, current: (s) => Math.min(s.totalCrystals, 1e9), target: 1e9 },
                    { id: 3, label: 'Compre 10 upgrades no passado', check: (s) => s.totalUpgrades >= 10, current: (s) => Math.min(s.totalUpgrades, 10), target: 10 },
                    { id: 4, label: 'Obtenha a Sabedoria Ancestral (mítico do passado)', check: (s) => s.inventory.some(i => i.itemId === 'ancestral_wisdom'), current: (s) => s.inventory.some(i => i.itemId === 'ancestral_wisdom') ? 1 : 0, target: 1 },
                    { id: 5, label: 'Faça 3 Prestígios na Era Primordial', check: (s) => s.prestigeCountPast >= 3, current: (s) => s.prestigeCountPast, target: 3 },
                    { id: 6, label: 'Acumule 50 Fragmentos Temporais', check: (s) => s.temporalFragments >= 50, current: (s) => Math.min(s.temporalFragments, 50), target: 50 },
                    { id: 7, label: 'Equipe 2 itens no passado', check: (s) => s.equippedSlots.filter(Boolean).length === 2, current: (s) => s.equippedSlots.filter(Boolean).length, target: 2 },
                ];
            }

            function checkFutureQuest() {
                if (state.futureQuestStep >= 8) return; // já liberado
                // Só progride enquanto no passado (estado do passado é o `state` atual).
                const steps = getFutureQuestSteps();
                // O step atual é o próximo não concluído (1-based). futureQuestStep = nº de passos feitos.
                while (state.futureQuestStep < steps.length && steps[state.futureQuestStep].check(state)) {
                    state.futureQuestStep += 1;
                    if (state.futureQuestStep < steps.length) {
                        showToast('🌀', `Passo ${state.futureQuestStep}/7 concluído: ${steps[state.futureQuestStep - 1].label}!`);
                        showNPCDialog(`Você avançou na profecia! Próximo objetivo: ${steps[state.futureQuestStep].label}`);
                    }
                }
                if (state.futureQuestStep >= 8) {
                    showToast('🌌', 'A Era do Futuro foi desbloqueada! Uma fenda temporal se abriu...');
                    showNPCDialog('A realidade se dobra diante de você. O Futuro aguarda além do Portal!');
                }
                saveGameDebounced();
            }

            function canTravelToFuture() {
                if (state.era === 'future') return true;
                return state.futureQuestStep >= 8;
            }

            function travelToFuture() {
                if (state.era !== 'past' || !canTravelToFuture()) return;
                saveCurrentStateToEra('past');
                loadStateFromEra('future');
                state.era = 'future';
                showToast('🌌', 'Você atravessou o véu do tempo! Bem-vindo à Era do Futuro.');
                needsRenderUpgrades = true;
                needsRenderAchievements = true;
                needsRenderGacha = true;
                needsRenderPrestige = true;
                needsRenderInventory = true;
                needsRenderContracts = true;
                needsRenderRumors = true;
                needsRenderPortal = true;
                document.body.classList.add('era-future');
                updateDisplay();
                renderAll();
                scheduleGoldenCrystal();
                saveGameDebounced();
            }

            function travelToPresent() {
                if (state.era !== 'past' && state.era !== 'future') return;
                saveCurrentStateToEra(state.era);
                loadStateFromEra('present');
                state.era = 'present';
                document.body.classList.remove('era-future');
                showToast('🌟', 'Você retornou ao presente!');
                needsRenderUpgrades = true;
                needsRenderAchievements = true;
                needsRenderGacha = true;
                needsRenderPrestige = true;
                needsRenderInventory = true;
                needsRenderContracts = true;
                needsRenderRumors = true;
                needsRenderPortal = true;
                updateDisplay();
                renderAll();
                scheduleGoldenCrystal();
                saveGameDebounced();
            }

            function saveCurrentStateToEra(era) {
                const eraState = {
                    crystals: state.crystals,
                    totalCrystals: state.totalCrystals,
                    totalClicks: state.totalClicks,
                    totalUpgrades: state.totalUpgrades,
                    prestigePoints: state.prestigePoints,
                    prestigeCount: state.prestigeCount,
                    playTime: state.playTime,
                    goldenCrystalActive: state.goldenCrystalActive,
                    goldenCrystalExpiresAt: state.goldenCrystalExpiresAt,
                    goldenCrystalPosX: state.goldenCrystalPosX,
                    goldenCrystalPosY: state.goldenCrystalPosY,
                    goldenCrystalsCaught: state.goldenCrystalsCaught,
                    lifetimeGoldenCrystalsCaught: state.lifetimeGoldenCrystalsCaught,
                    upgrades: { ...state.upgrades },
                    inventory: state.inventory.map(item => ({ ...item })),
                    equippedSlots: [...state.equippedSlots],
                    gachaPulls: state.gachaPulls,
                    pityCounter: state.pityCounter,
                    nextUid: state.nextUid,
                    gachaCoins: state.gachaCoins,
                    dailyContractDate: state.dailyContractDate,
                    dailyContracts: state.dailyContracts.map(c => ({ ...c })),
                    luckyFragments: state.luckyFragments,
                    dailyStats: { ...state.dailyStats },
                    autoAccumulator: state.autoAccumulator,
                    prestigeCountPast: state.prestigeCountPast,
                    ownedSpecialItems: Array.isArray(state.ownedSpecialItems) ? [...state.ownedSpecialItems] : [],
                    realityFragments: state.realityFragments || 0,
                    cosmicAscensions: state.cosmicAscensions || 0,
                };
                if (era === 'present') state.presentState = eraState;
                else if (era === 'future') state.futureState = eraState;
                else state.pastState = eraState;
            }

            function loadStateFromEra(era) {
                const eraState = era === 'present' ? state.presentState : era === 'future' ? state.futureState : state.pastState;
                if (!eraState) return;

                const defaultUpgradesDefs = era === 'present' ? UPGRADES_DEFS : era === 'future' ? UPGRADES_DEFS_FUTURE : UPGRADES_DEFS_PAST;
                state.upgrades = { ...(eraState.upgrades && typeof eraState.upgrades === 'object' ? eraState.upgrades : Object.fromEntries(defaultUpgradesDefs.map(u => [u.id, 0]))) };
                state.inventory = Array.isArray(eraState.inventory) ? eraState.inventory.map(item => ({ ...item })) : [];
                state.equippedSlots = Array.isArray(eraState.equippedSlots) && eraState.equippedSlots.length === 2 ? [...eraState.equippedSlots] : [null, null];
                state.gachaPulls = eraState.gachaPulls || 0;
                state.pityCounter = eraState.pityCounter || 0;
                state.nextUid = eraState.nextUid || 1;
                state.gachaCoins = eraState.gachaCoins || 0;
                state.dailyContractDate = eraState.dailyContractDate || '';
                state.dailyContracts = Array.isArray(eraState.dailyContracts) ? eraState.dailyContracts.map(c => ({ ...c })) : [];
                state.luckyFragments = eraState.luckyFragments || 0;
                state.dailyStats = { clicks: 0, crystals: 0, golden: 0, upgrades: 0, ...(eraState.dailyStats && typeof eraState.dailyStats === 'object' ? eraState.dailyStats : {}) };
                state.autoAccumulator = eraState.autoAccumulator || 0;
                state.prestigeCountPast = eraState.prestigeCountPast || 0;
                state.ownedSpecialItems = Array.isArray(eraState.ownedSpecialItems) ? [...eraState.ownedSpecialItems] : [];
                state.realityFragments = Number.isFinite(eraState.realityFragments) ? eraState.realityFragments : 0;
                state.cosmicAscensions = Number.isFinite(eraState.cosmicAscensions) ? eraState.cosmicAscensions : 0;

                state.crystals = Number.isFinite(eraState.crystals) ? eraState.crystals : 0;
                state.totalCrystals = Number.isFinite(eraState.totalCrystals) ? eraState.totalCrystals : 0;
                state.totalClicks = Number.isFinite(eraState.totalClicks) ? eraState.totalClicks : 0;
                state.totalUpgrades = Number.isFinite(eraState.totalUpgrades) ? eraState.totalUpgrades : 0;
                state.prestigePoints = Number.isFinite(eraState.prestigePoints) ? eraState.prestigePoints : 0;
                state.prestigeCount = Number.isFinite(eraState.prestigeCount) ? eraState.prestigeCount : 0;
                state.playTime = Number.isFinite(eraState.playTime) ? eraState.playTime : 0;
                state.goldenCrystalActive = !!eraState.goldenCrystalActive;
                state.goldenCrystalExpiresAt = Number.isFinite(eraState.goldenCrystalExpiresAt) ? eraState.goldenCrystalExpiresAt : 0;
                state.goldenCrystalPosX = Number.isFinite(eraState.goldenCrystalPosX) ? eraState.goldenCrystalPosX : 40;
                state.goldenCrystalPosY = Number.isFinite(eraState.goldenCrystalPosY) ? eraState.goldenCrystalPosY : -40;
                state.goldenCrystalsCaught = Number.isFinite(eraState.goldenCrystalsCaught) ? eraState.goldenCrystalsCaught : 0;
                state.lifetimeGoldenCrystalsCaught = Number.isFinite(eraState.lifetimeGoldenCrystalsCaught) ? eraState.lifetimeGoldenCrystalsCaught : 0;
            }

            function syncStateWithEra() {
                if (state.era === 'present') {
                    if (!state.presentState) state.presentState = createEraState('present');
                    loadStateFromEra('present');
                } else if (state.era === 'future') {
                    if (!state.futureState) state.futureState = createEraState('future');
                    loadStateFromEra('future');
                } else {
                    if (!state.pastState) state.pastState = createEraState('past');
                    loadStateFromEra('past');
                }
            }

            // ===== RENDER =====
            const lastDisplayTexts = {
                crystals: '',
                cps: '',
                level: '',
                clickPower: '',
                gachaCoins: '',
                statCrystals: '',
                statTotalCrystals: '',
                statGachaCoins: '',
                statClicks: '',
                statUpgrades: '',
                statPrestiges: '',
                statAchievements: '',
                statGachaPulls: '',
                statInventoryCount: '',
                statTime: '',
            };

            function isTabVisible(tab) {
                const tabEl = document.querySelector('.tab[data-tab="' + tab + '"]');
                const panel = document.getElementById(tab);
                return !!tabEl && tabEl.classList.contains('active') && !!panel && panel.classList.contains('active');
            }

            function updateDisplay() {
                const crystals = state.crystals;
                const autoPower = getAutoPower();
                const level = getLevel(state.totalCrystals);
                const clickPower = getClickPower();
                const progress = getLevelProgress(state.totalCrystals);

                const crystalsText = formatNumber(crystals);
                if (crystalsText !== lastDisplayTexts.crystals) {
                    crystalCountEl.textContent = crystalsText;
                    lastDisplayTexts.crystals = crystalsText;
                }
                const cpsText = formatNumber(autoPower);
                if (cpsText !== lastDisplayTexts.cps) {
                    cpsDisplayEl.textContent = cpsText;
                    lastDisplayTexts.cps = cpsText;
                }
                const levelText = String(level);
                if (levelText !== lastDisplayTexts.level) {
                    levelDisplayEl.textContent = levelText;
                    lastDisplayTexts.level = levelText;
                }
                const clickPowerText = formatNumber(clickPower);
                if (clickPowerText !== lastDisplayTexts.clickPower) {
                    clickPowerValueEl.textContent = clickPowerText;
                    lastDisplayTexts.clickPower = clickPowerText;
                }
                const gachaCoinsText = formatNumber(state.gachaCoins);
                if (gachaCoinsText !== lastDisplayTexts.gachaCoins) {
                    gachaCoinCountEl.textContent = gachaCoinsText;
                    lastDisplayTexts.gachaCoins = gachaCoinsText;
                }
                levelBarFillEl.style.width = (progress * 100).toFixed(2) + '%';

                if (statCrystalsEl) {
                    const val = formatNumber(state.crystals);

            function formatUpgradeDesc(def) {
                // Mostra o valor percentual quando aplicável (upgrades híbridos)
                if (def.percent) {
                    const pct = Math.round(def.percent * 100);
                    return `+${pct}% por ${def.type === 'click' ? 'clique' : 'produção automática'}`;
                }
                return def.desc;
            }

            function renderUpgrades() {
                if (!needsRenderUpgrades) return;
                upgradesListEl.innerHTML = '';
                const defs = getCurrentUpgradesDefs();
                let hasUpgrades = false;
                for (const def of defs) {
                    if (!def.unlock(state)) continue;
                    if (currentUpgradeFilter !== 'all' && def.type !== currentUpgradeFilter) continue;
                    hasUpgrades = true;
                    const level = state.upgrades[def.id] || 0;
                    const atMax = def.maxLevel !== undefined && level >= def.maxLevel;
                    const cost = atMax ? 0 : getUpgradeCost(def);
                    const affordable = !atMax && state.crystals >= cost;
                    const card = document.createElement('div');
                    card.className = 'upgrade-card' + (atMax ? ' maxed' : (affordable ? ' affordable' : ' not-affordable'));
                    card.setAttribute('data-upgrade-id', def.id);
                    card.innerHTML = `
                        <div class="glow-bg"></div>
                        <div class="upgrade-icon">${def.icon}</div>
                        <div class="upgrade-info">
                            <div class="upgrade-name">${def.name}</div>
                            <div class="upgrade-desc">${formatUpgradeDesc(def)}</div>
                            <div class="upgrade-level">Nível ${level}${def.maxLevel !== undefined ? ' / ' + def.maxLevel : ''}</div>
                        </div>
                        <div class="upgrade-cost">
                            <div class="cost-label">${atMax ? 'Status' : 'Custo'}</div>
                            <div class="cost-value">${atMax ? '🔒 MÁX' : '💎 ' + formatNumber(cost)}</div>
                        </div>
                    `;
                    card.addEventListener('click', () => buyUpgrade(def.id));
                    upgradesListEl.appendChild(card);
                }
                if (!hasUpgrades) {
                    upgradesListEl.innerHTML = '<p style="text-align:center;padding:20px;color:var(--text-dim);">Continue minerando para desbloquear upgrades...</p>';
                }
                needsRenderUpgrades = false;
                updateUpgradesAffordability();
            }

            function updateUpgradesAffordability() {
                if (!upgradesListEl) return;
                // Otimização (Parte 3, Fase 6): só atualiza se a aba de upgrades está visível
                // e com throttle de ~300ms, evitando varrer todos os cards a cada tick de 100ms.
                const upgradesTab = document.querySelector('.tab[data-tab="upgrades"]');
                const upgradesTabVisible = upgradesTab && upgradesTab.classList.contains('active');
                if (!upgradesTabVisible) return;
                const now = Date.now();
                if (now - (updateUpgradesAffordability._last || 0) < 300) return;
                updateUpgradesAffordability._last = now;
                const cards = upgradesListEl.querySelectorAll('.upgrade-card');
                cards.forEach(card => {
                    const id = card.dataset.upgradeId;
                    const def = getCurrentUpgradesDefs().find(u => u.id === id);
                    if (!def) return;
                    const level = state.upgrades[def.id] || 0;
                    if (def.maxLevel !== undefined && level >= def.maxLevel) {
                        card.classList.add('maxed');
                        card.classList.remove('affordable', 'not-affordable');
                        return;
                    }
                    const cost = getUpgradeCost(def);
                    const affordable = state.crystals >= cost;
                    if (affordable) {
                        card.classList.add('affordable');
                        card.classList.remove('not-affordable');
                    } else {
                        card.classList.remove('affordable');
                        card.classList.add('not-affordable');
                    }
                });
            }

            function buyTemporalUpgrade(id) {
                const def = TEMPORAL_UPGRADES_DEFS.find(t => t.id === id);
                if (!def) return;
                const level = state.temporalUpgrades?.[id] || 0;
                const cost = Math.floor(def.baseCost * Math.pow(def.costMult, level));
                if (state.temporalFragments < cost) return;
                state.temporalFragments -= cost;
                if (!state.temporalUpgrades) state.temporalUpgrades = {};
                state.temporalUpgrades[id] = level + 1;
                showToast('🛒', `Melhoria comprada: ${def.name}!`);
                needsRenderPrestige = true;
                updateDisplay();
                saveGameDebounced();
            }

            function renderContracts() {
                if (!contractsPanelEl) return;
                contractsPanelEl.innerHTML = '';
                resetDailyProgressIfNeeded();

                if (state.dailyContracts.length === 0) {
                    contractsPanelEl.innerHTML = '<p style="text-align:center;padding:20px;color:var(--text-dim);">Nenhum contrato disponível hoje.</p>';
                    return;
                }

                for (const contract of state.dailyContracts) {
                    const def = DAILY_CONTRACTS_DEFS.find(d => d.id === contract.id);
                    if (!def) continue;

                    let current = 0;
                    switch(def.id) {
                        case 'clicks': current = state.dailyStats.clicks; break;
                        case 'mine': current = state.dailyStats.crystals; break;
                        case 'golden': current = state.dailyStats.golden; break;
                        case 'upgrades': current = state.dailyStats.upgrades; break;
                        case 'level': current = getLevel(state.totalCrystals); break;
                    }

                    const progress = Math.min(current / def.target, 1);
                    const completed = contract.completed || false;
                    const claimed = contract.claimed || false;

                    const card = document.createElement('div');
                    card.className = 'contract-card' + (claimed ? ' claimed' : completed ? ' completed' : '');
                    card.innerHTML = `
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                            <div style="flex:1;min-width:150px;">
                                <div style="font-weight:700;font-size:0.9rem;">${def.desc}</div>
                                <div style="font-size:0.75rem;color:var(--text-secondary);">Progresso: ${formatNumber(current)}/${formatNumber(def.target)}</div>
                                <div style="font-size:0.7rem;color:var(--accent-gold);">Recompensa: 🪙 ${def.reward} Gacha Coins</div>
                            </div>
                            <div style="text-align:center;min-width:80px;">
                                <div style="width:60px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;">
                                    <div style="height:100%;width:${(progress*100).toFixed(0)}%;background:linear-gradient(90deg,var(--accent-green),var(--accent-cyan));border-radius:3px;transition:width 0.5s;"></div>
                                </div>
                                <div style="font-size:0.7rem;color:${claimed ? 'var(--accent-green)' : completed ? 'var(--accent-cyan)' : 'var(--text-dim)'};">${claimed ? '✅ Reivindicado' : completed ? '✅ Concluído' : 'Pendente'}</div>
                                ${completed && !claimed ? `<button class="claim-btn" data-contract-id="${def.id}">Reivindicar</button>` : ''}
                            </div>
                        </div>
                    `;
                    if (completed && !claimed) {
                        card.querySelector('.claim-btn').addEventListener('click', (e) => {
                            e.stopPropagation();
                            claimContract(def.id);
                        });
                    }
                    contractsPanelEl.appendChild(card);
                }
            }

            function renderRumors() {
                if (!rumorsPanelEl) return;
                rumorsPanelEl.innerHTML = '';
                const items = getCurrentItemsDefs().filter(d => d.hints);
                if (items.length === 0) {
                    rumorsPanelEl.innerHTML = '<p style="text-align:center;padding:20px;color:var(--text-dim);">Nenhum rumor disponível nesta era.</p>';
                    return;
                }
                
                let hasVisibleRumor = false;
                
                for (const def of items) {
                    const owned = state.inventory.some(item => item.itemId === def.id);
                    const firstHintKey = def.id + '_' + def.hints[0].progress;
                    const hasHint = state.hintsSeen[firstHintKey] || owned;
                    
                    if (!hasHint) continue;
                    hasVisibleRumor = true;
                    
                    const progress = getProgressForItem(def, state);
                    const card = document.createElement('div');

            // ===== POOL DE PARTÍCULAS (implementação) =====
            function prefersReducedMotion() {
                try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
            }

            function createParticles(event, count, golden) {
                if (prefersReducedMotion()) return;
                const rect = crystalWrapperEl.getBoundingClientRect();
                const cx = event.clientX || rect.left + rect.width / 2;
                const cy = event.clientY || rect.top + rect.height / 2;
                count = Math.min(count, 5); // Limita ainda mais
                for (let i = 0; i < count; i++) {
                    if (particlePool.length === 0) continue;
                    const particle = particlePool[particleIndex % particlePool.length];
                    particleIndex++;
                    const size = golden ? Math.random() * 8 + 4 : Math.random() * 6 + 2;
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 120 + 40;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance - 60;
                    const colors = golden ? ['#ffd700', '#ff8c00', '#ffee00', '#ffaa00'] : ['#00ffff', '#00ccff', '#ff00ff', '#cc00ff', '#ffffff', '#88ffff'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.left = cx + 'px';
                    particle.style.top = cy + 'px';
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.background = color;
                    particle.style.boxShadow = `0 0 ${size*2}px ${color}`;
                    particle.style.setProperty('--tx', tx + 'px');
                    particle.style.setProperty('--ty', ty + 'px');
                    particle.style.display = 'block';
                    // Reinicia animação
                    particle.classList.remove('particle');
                    void particle.offsetWidth;
                    particle.classList.add('particle');
                    clearTimeout(particle._hideTimeout);
                    particle._hideTimeout = setTimeout(() => {
                        particle.style.display = 'none';
                    }, 800);
                }
            }

            function createFloatingText(event, text, golden, customColor) {
                if (prefersReducedMotion()) return;
                const rect = crystalWrapperEl.getBoundingClientRect();
                const cx = event.clientX || rect.left + rect.width / 2;
                const cy = event.clientY || rect.top + rect.height / 2 - 30;
                createFloatingTextAt(cx + (Math.random() * 30 - 15), cy, text, golden, customColor);
            }

            function createFloatingTextAt(x, y, text, golden, customColor) {
                if (floatingTextPool.length === 0) return;
                const el = floatingTextPool[floatingTextIndex % floatingTextPool.length];
                floatingTextIndex++;
                el.className = 'floating-text' + (golden ? ' golden' : '');
                el.textContent = text;
                if (customColor) {
                    el.style.color = customColor;
                    el.style.textShadow = `0 0 10px ${customColor}, 0 2px 4px rgba(0,0,0,0.5)`;
                } else {
                    el.style.color = '';
                    el.style.textShadow = '';
                }
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.display = 'block';
                // Reinicia animação
                el.classList.remove('floating-text');
                void el.offsetWidth;
                el.classList.add('floating-text');
                clearTimeout(el._hideTimeout);
                el._hideTimeout = setTimeout(() => {
                    el.style.display = 'none';
                }, 1000);
            }

            function showToast(icon, text) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                // BUG FIX A6: usar textContent em vez de innerHTML para evitar XSS acidental
                // ao adicionar centenas de strings de conteúdo novas (ícones/descrições).

                iconEl.className = 'toast-icon';
                iconEl.textContent = icon;
                const textEl = document.createElement('span');
                textEl.className = 'toast-text';
                textEl.textContent = text;
                toast.appendChild(iconEl);
                toast.appendChild(textEl);

            function showModal(title, text, onConfirm) {

                modalTextEl.textContent = text;
                modalOverlayEl.classList.remove('hidden');
                modalConfirmBtn.onclick = () => {
                    modalOverlayEl.classList.add('hidden');
                    onConfirm();

                modalCancelBtn.onclick = () => {

            // ===== SOM =====
            let audioCtx = null;
            function getAudioContext() {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                return audioCtx;
            }
            function playTone(freq, duration, type, volume, delay) {
                if (!state.soundEnabled) return;
                try {
                    const ctx = getAudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type || 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + (delay || 0));
                    gain.gain.setValueAtTime(volume || 0.15, ctx.currentTime + (delay || 0));
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (delay || 0) + duration);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + (delay || 0)); osc.stop(ctx.currentTime + (delay || 0) + duration);
                } catch (e) {}
            }
            function playClickSound(golden) {
                if (golden) { playTone(1200,0.08,'triangle',0.2,0); playTone(1800,0.06,'sine',0.15,0.04); }
                else { playTone(800,0.06,'triangle',0.15,0); playTone(1200,0.04,'sine',0.08,0.02); }
            }
            function playBuySound() { playTone(600,0.08,'sine',0.18,0); playTone(900,0.08,'sine',0.15,0.08); playTone(1200,0.1,'sine',0.12,0.16); }
            function playGoldenSound() { playTone(800,0.1,'triangle',0.2,0); playTone(1200,0.1,'triangle',0.2,0.08); playTone(1600,0.12,'sine',0.18,0.16); playTone(2000,0.15,'sine',0.15,0.24); }
            function playPrestigeSound() { playTone(400,0.15,'sine',0.2,0); playTone(600,0.15,'sine',0.2,0.15); playTone(800,0.2,'sine',0.2,0.3); playTone(1200,0.3,'sine',0.18,0.45); playTone(1600,0.4,'sine',0.15,0.6); }
            function playAchievementSound() { playTone(1000,0.08,'triangle',0.15,0); playTone(1400,0.08,'triangle',0.15,0.08); playTone(1800,0.1,'sine',0.18,0.16); }

            // ===== THROTTLE PARA VIBRAÇÃO E SOM =====
            let lastVibrate = 0;
            function safeVibrate(pattern) {
                const now = Date.now();
                if (now - lastVibrate > 100) {
                    lastVibrate = now;
                    if (navigator.vibrate) navigator.vibrate(pattern);
                }
            }

            let lastClickSoundTime = 0;
            function throttledPlayClickSound(golden) {
                const now = Date.now();
                if (now - lastClickSoundTime > 80) {
                    lastClickSoundTime = now;
                    playClickSound(golden);
                }
            }

            // ===== SAVE =====
            function saveGame() {
                if (!allowSave) return;
                state.lastSave = Date.now();
                saveCurrentStateToEra(state.era);
                try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { console.error('Falha ao salvar:', e); }
            }

            function saveGameDebounced() {
                if (!allowSave) return;
                if (saveDebounceTimeout) clearTimeout(saveDebounceTimeout);
                saveDebounceTimeout = setTimeout(() => {
                    saveGame();
                    saveDebounceTimeout = null;
                }, 500);
            }

            function ensureUpgrades(eraState, defs) {
                if (!eraState.upgrades || typeof eraState.upgrades !== 'object') {
                    eraState.upgrades = {};
                }
                for (const def of defs) {
                    if (!(def.id in eraState.upgrades)) {
                        eraState.upgrades[def.id] = 0;
                    } else if (def.maxLevel !== undefined && eraState.upgrades[def.id] > def.maxLevel) {
                        // Clamp saves antigos que compraram além do novo teto de nível.
                        eraState.upgrades[def.id] = def.maxLevel;
                    }
                }
            }

            function ensureAchievements(s) {
                if (!s.achievements || typeof s.achievements !== 'object') {
                    s.achievements = {};
                }
                for (const ach of ACHIEVEMENTS_DEFS) {
                    if (!(ach.id in s.achievements)) {
                        s.achievements[ach.id] = false;
                    }
                }
            }

            // BUG FIX #5: valida a estrutura mínima de um save (objeto, era válida,
            // presentState/pastState presentes) antes de aceitá-lo, seja vindo do
            // localStorage ou de um código importado pelo usuário.
            function isValidSaveShape(parsed) {
                if (!parsed || typeof parsed !== 'object') return false;
                if (parsed.era !== undefined && parsed.era !== 'present' && parsed.era !== 'past' && parsed.era !== 'future') return false;
                if (parsed.presentState !== undefined && (typeof parsed.presentState !== 'object' || parsed.presentState === null)) return false;
                if (parsed.pastState !== undefined && (typeof parsed.pastState !== 'object' || parsed.pastState === null)) return false;
                if (parsed.futureState !== undefined && (typeof parsed.futureState !== 'object' || parsed.futureState === null)) return false;
                // BUG FIX A5: validação mínima de tipos para campos numéricos e de estado,
                // impedindo que saves editados/turbinados quebrem o jogo (NaN/strings inválidas).
                const numOk = (v) => v === undefined || (typeof v === 'number' && Number.isFinite(v));
                if (!numOk(parsed.lifetimeTotalCrystals) || !numOk(parsed.lifetimeTotalClicks) ||
                    !numOk(parsed.lifetimeUpgrades) || !numOk(parsed.lifetimeGoldenCrystalsCaught) ||
                    !numOk(parsed.temporalFragments) || !numOk(parsed.timeTravelCount) ||
                    !numOk(parsed.futureQuestStep)) return false;
                const eraOk = (era) => {
                    if (era === undefined) return true;
                    if (typeof era !== 'object' || era === null) return false;
                    return numOk(era.crystals) && numOk(era.totalCrystals) && numOk(era.totalClicks) &&
                           numOk(era.totalUpgrades) && numOk(era.prestigePoints) && numOk(era.prestigeCount) &&
                           numOk(era.goldenCrystalsCaught) && numOk(era.autoAccumulator) &&
                           (!era.upgrades || typeof era.upgrades === 'object') &&
                           (!era.inventory || Array.isArray(era.inventory));
                };
                if (!eraOk(parsed.presentState) || !eraOk(parsed.pastState) || !eraOk(parsed.futureState)) return false;
                return true;
            }

            function loadState() {
                try {
                    const saved = localStorage.getItem(SAVE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (!isValidSaveShape(parsed)) {
                            console.error('Save corrompido/malformado encontrado no localStorage. Iniciando novo jogo.');
                            const def = defaultState();
                            ensureAchievements(def);
                            return def;
                        }
                        const merged = {
                            era: parsed.era || 'present',
                            presentState: { ...createEraState('present'), ...(parsed.presentState || {}) },
                            pastState: { ...createEraState('past'), ...(parsed.pastState || {}) },
                            futureState: { ...createEraState('future'), ...(parsed.futureState || {}) },
                            achievements: parsed.achievements || {},
                            // BUG FIX #1: as estatísticas globais de vida (lifetimeTotalCrystals,
                            // lifetimeTotalClicks, lifetimeUpgrades) e as conquistas são salvas na
                            // raiz do estado (state.lifetimeTotalCrystals etc, ver saveGame()), então
                            // precisam ser lidas diretamente da raiz do save, não de dentro de
                            // presentState/pastState.
                            lifetimeTotalCrystals: Number.isFinite(parsed.lifetimeTotalCrystals) ? parsed.lifetimeTotalCrystals : 0,
                            lifetimeTotalClicks: Number.isFinite(parsed.lifetimeTotalClicks) ? parsed.lifetimeTotalClicks : 0,
                            lifetimeUpgrades: Number.isFinite(parsed.lifetimeUpgrades) ? parsed.lifetimeUpgrades : 0,
                            lifetimeGoldenCrystalsCaught: Number.isFinite(parsed.lifetimeGoldenCrystalsCaught) ? parsed.lifetimeGoldenCrystalsCaught : 0,
                            temporalFragments: Number.isFinite(parsed.temporalFragments) ? parsed.temporalFragments : 0,
                            timeTravelCount: parsed.timeTravelCount || 0,
                            futureQuestStep: Number.isFinite(parsed.futureQuestStep) ? parsed.futureQuestStep : 0,
                            realityUpgrades: parsed.realityUpgrades || {},
                            soundEnabled: parsed.soundEnabled !== undefined ? parsed.soundEnabled : true,
                            hintsSeen: parsed.hintsSeen || {},
                            temporalUpgrades: parsed.temporalUpgrades || {},
                            lastSave: parsed.lastSave || Date.now(),
                        };

                        // Compatibilidade com saves antigos (formato onde os globais ficavam
                        // dentro de presentState/pastState): só sobrescreve se a raiz não tiver
                        // o valor e o valor antigo existir.
                        if (parsed.era === 'present' && parsed.presentState) {
                            if (!parsed.lifetimeTotalCrystals && typeof parsed.presentState.lifetimeTotalCrystals === 'number') merged.lifetimeTotalCrystals = parsed.presentState.lifetimeTotalCrystals;
                            if (!parsed.lifetimeTotalClicks && typeof parsed.presentState.lifetimeTotalClicks === 'number') merged.lifetimeTotalClicks = parsed.presentState.lifetimeTotalClicks;
                            if (!parsed.lifetimeUpgrades && typeof parsed.presentState.lifetimeUpgrades === 'number') merged.lifetimeUpgrades = parsed.presentState.lifetimeUpgrades;
                            if (!parsed.achievements && parsed.presentState.achievements && typeof parsed.presentState.achievements === 'object') {
                                merged.achievements = { ...parsed.presentState.achievements };
                            }
                        } else if (parsed.era === 'past' && parsed.pastState) {
                            if (!parsed.lifetimeTotalCrystals && typeof parsed.pastState.lifetimeTotalCrystals === 'number') merged.lifetimeTotalCrystals = parsed.pastState.lifetimeTotalCrystals;
                            if (!parsed.lifetimeTotalClicks && typeof parsed.pastState.lifetimeTotalClicks === 'number') merged.lifetimeTotalClicks = parsed.pastState.lifetimeTotalClicks;
                            if (!parsed.lifetimeUpgrades && typeof parsed.pastState.lifetimeUpgrades === 'number') merged.lifetimeUpgrades = parsed.pastState.lifetimeUpgrades;
                            if (!parsed.achievements && parsed.pastState.achievements && typeof parsed.pastState.achievements === 'object') {
                                merged.achievements = { ...parsed.pastState.achievements };
                            }
                        }

                        // Garantir chaves de upgrades
                        ensureUpgrades(merged.presentState, UPGRADES_DEFS);
                        ensureUpgrades(merged.pastState, UPGRADES_DEFS_PAST);
                        ensureUpgrades(merged.futureState, UPGRADES_DEFS_FUTURE);

                        // Garantir conquistas globais
                        ensureAchievements(merged);

                        // Normalizar arrays
                        if (!Array.isArray(merged.presentState.inventory)) merged.presentState.inventory = [];
                        if (!Array.isArray(merged.pastState.inventory)) merged.pastState.inventory = [];
                        if (!Array.isArray(merged.presentState.equippedSlots) || merged.presentState.equippedSlots.length !== 2) merged.presentState.equippedSlots = [null, null];
                        if (!Array.isArray(merged.pastState.equippedSlots) || merged.pastState.equippedSlots.length !== 2) merged.pastState.equippedSlots = [null, null];
                        if (!Array.isArray(merged.presentState.dailyContracts)) merged.presentState.dailyContracts = [];
                        if (!Array.isArray(merged.pastState.dailyContracts)) merged.pastState.dailyContracts = [];
                        if (typeof merged.presentState.dailyStats !== 'object' || merged.presentState.dailyStats === null) merged.presentState.dailyStats = { clicks:0, crystals:0, golden:0, upgrades:0 };
                        if (typeof merged.pastState.dailyStats !== 'object' || merged.pastState.dailyStats === null) merged.pastState.dailyStats = { clicks:0, crystals:0, golden:0, upgrades:0 };
                        if (!Array.isArray(merged.presentState.ownedSpecialItems)) merged.presentState.ownedSpecialItems = [];
                        if (!Array.isArray(merged.pastState.ownedSpecialItems)) merged.pastState.ownedSpecialItems = [];

                        // Normalizar estado do futuro (save-compat: futuroState ausente em saves antigos)
                        if (!Array.isArray(merged.futureState.inventory)) merged.futureState.inventory = [];
                        if (!Array.isArray(merged.futureState.equippedSlots) || merged.futureState.equippedSlots.length !== 2) merged.futureState.equippedSlots = [null, null];
                        if (!Array.isArray(merged.futureState.dailyContracts)) merged.futureState.dailyContracts = [];
                        if (typeof merged.futureState.dailyStats !== 'object' || merged.futureState.dailyStats === null) merged.futureState.dailyStats = { clicks:0, crystals:0, golden:0, upgrades:0 };
                        if (!Array.isArray(merged.futureState.ownedSpecialItems)) merged.futureState.ownedSpecialItems = [];
                        if (!Number.isFinite(merged.futureState.realityFragments)) merged.futureState.realityFragments = 0;
                        if (!Number.isFinite(merged.futureState.cosmicAscensions)) merged.futureState.cosmicAscensions = 0;
                        if (typeof merged.realityUpgrades !== 'object' || merged.realityUpgrades === null) merged.realityUpgrades = {};
                        // futureQuestStep deve ficar em [0,8]
                        if (!Number.isInteger(merged.futureQuestStep) || merged.futureQuestStep < 0 || merged.futureQuestStep > 8) merged.futureQuestStep = 0;

                        return merged;
                    }
                } catch (e) {
                    console.error('Erro ao carregar save:', e);
                }
                const def = defaultState();
                ensureAchievements(def);
                return def;
            }

            function formatNumber(num) {
                if (!Number.isFinite(num)) return '0';
                if (num < 1000) return Math.floor(num).toString();
                const units = ['', 'K', 'M', 'B', 'T', 'Aa', 'Ab', 'Ac', 'Ad', 'Ae', 'Af', 'Ag', 'Ah', 'Ai', 'Aj'];
                let tier = Math.floor(Math.log10(Math.abs(num)) / 3);
                if (tier < 1) tier = 1;
                if (tier >= units.length) return num.toExponential(2);
                const scaled = num / Math.pow(1000, tier);
                return scaled.toFixed(2) + units[tier];
            }
            function formatTime(seconds) {
                if (seconds < 60) return seconds+'s';
                const mins = Math.floor(seconds/60); const secs = seconds%60;
                if (mins < 60) return mins+'m '+secs+'s';
                const hours = Math.floor(mins/60); const remainingMins = mins%60;
                return hours+'h '+remainingMins+'m';
            }

            // ===== GAME LOOP =====
            function gameLoop() {
                const now = Date.now();
                const delta = (now - lastTickTime) / 1000;
                lastTickTime = now;

                const autoPower = getAutoPower();
                if (autoPower > 0) {
                    state.autoAccumulator += autoPower * delta;
                    const integerPart = Math.floor(state.autoAccumulator);
                    if (integerPart > 0) {
                        addCrystalsAndProgress(integerPart);
                        state.autoAccumulator -= integerPart;
                    }
                }

                if (!document.hidden) {
                    state.playTime += delta;
                }

                if (state.goldenCrystalActive && now > state.goldenCrystalExpiresAt) {
                    hideGoldenCrystal();
                }

                // BUG FIX #4: as verificações pesadas (itens especiais, dicas, conquistas)
                // agora rodam no máximo 1x/s em vez de a cada tick de 100ms (10x/s),
                // reduzindo o trabalho por segundo em ~90% sem perder responsividade percebida.
                if (now - lastHeavyCheckTime >= HEAVY_CHECK_INTERVAL) {
                    lastHeavyCheckTime = now;
                    checkSpecialItems();
                    checkHints();
                    checkAchievements();
                    if (state.era === 'past') checkFutureQuest();
                }

                updateDisplay();
                updateUpgradesAffordability();
                if (needsRenderUpgrades && isTabVisible('upgrades')) renderUpgrades();
                if (needsRenderAchievements && isTabVisible('achievements')) renderAchievements();
                if (needsRenderGacha && isTabVisible('gacha')) renderGacha();
                if (needsRenderPrestige && isTabVisible('prestige')) renderPrestige();
                if (needsRenderInventory && isTabVisible('inventory')) renderInventory();
                if (needsRenderContracts && isTabVisible('contracts')) renderContracts();
                if (needsRenderRumors && isTabVisible('rumors')) renderRumors();
                if (needsRenderPortal && isTabVisible('portal')) renderPortal();
                if (now - state.lastSave > SAVE_INTERVAL) saveGame();
            }

            function contractCheckInterval() {
                checkDailyContracts();
                updateContractsBadge();
            }

            function spawnGoldenCrystal() {
                if (state.goldenCrystalActive) return;
                state.goldenCrystalActive = true;
                state.goldenCrystalExpiresAt = Date.now() + GOLDEN_CRYSTAL_DURATION;
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 60;
                const posX = Math.cos(angle) * distance;
                const posY = Math.sin(angle) * distance;
                state.goldenCrystalPosX = posX;
                state.goldenCrystalPosY = posY;
                goldenCrystalEl.style.left = `calc(50% + ${posX}px)`;
                goldenCrystalEl.style.top = `calc(50% + ${posY}px)`;
                goldenCrystalEl.classList.remove('hidden');
                goldenCrystalExpireTimeout = setTimeout(() => { hideGoldenCrystal(); }, GOLDEN_CRYSTAL_DURATION);
                showToast('🌟', 'Cristal Dourado apareceu!');
                playBuySound();
            }
            function hideGoldenCrystal() {
                if (!state.goldenCrystalActive) return;
                state.goldenCrystalActive = false;
                goldenCrystalEl.classList.add('hidden');
                if (goldenCrystalExpireTimeout) { clearTimeout(goldenCrystalExpireTimeout); goldenCrystalExpireTimeout = null; }
                scheduleGoldenCrystal();
            }
            function scheduleGoldenCrystal() {
                if (goldenCrystalTimeout) clearTimeout(goldenCrystalTimeout);
                const [min, max] = GOLDEN_CRYSTAL_INTERVAL;
                const delay = Math.random() * (max - min) + min;
                goldenCrystalTimeout = setTimeout(() => { spawnGoldenCrystal(); goldenCrystalTimeout = null; }, delay);
            }

            function resetSave() {
                showModal('Resetar Progresso', 'Tem certeza que deseja apagar todo o progresso salvo? Esta ação é irreversível!', () => {
                    allowSave = false;
                    localStorage.removeItem(SAVE_KEY);
                    window.removeEventListener('beforeunload', saveGame);
                    window.removeEventListener('pagehide', saveGame);
                    location.reload();
                });
            }

            function fallbackCopy(text) {
                const input = document.createElement('input');
                input.value = text;
                document.body.appendChild(input);
                input.select();
                try {
                    document.execCommand('copy');
                    showToast('📋', 'Código de save copiado!');
                } catch (e) {
                    showToast('❌', 'Falha ao copiar.');
                }
                document.body.removeChild(input);
            }

            function exportSave() {
                try {
                    const data = JSON.stringify(state);
                    const base64 = btoa(unescape(encodeURIComponent(data)));
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(base64).then(() => {
                            showToast('📋', 'Código de save copiado!');
                        }).catch(() => {
                            fallbackCopy(base64);
                        });
                    } else {
                        fallbackCopy(base64);
                    }
                } catch (e) {
                    showToast('❌', 'Falha ao exportar save.');
                }
            }

            function importSave() {
                const code = prompt('Cole o código de save aqui:');
                if (!code) return;
                try {
                    const data = decodeURIComponent(escape(atob(code)));
                    const parsed = JSON.parse(data);
                    // BUG FIX #5: valida a estrutura mínima antes de aceitar o save importado,
                    // evitando que um código colado malformado quebre o jogo ao recarregar.
                    if (isValidSaveShape(parsed) && parsed.era) {
                        allowSave = false;
                        localStorage.setItem(SAVE_KEY, JSON.stringify(parsed));
                        location.reload();
                    } else {
                        showToast('❌', 'Código de save inválido.');
                    }
                } catch (e) {
                    showToast('❌', 'Código de save inválido.');
                }
            }

            function applyOfflineProduction() {
                const now = Date.now();
                const elapsed = (now - state.lastSave) / 1000;
                if (elapsed > 60) {
                    const offlineSeconds = Math.min(elapsed, OFFLINE_MAX_HOURS * 3600);
                    const autoPower = getAutoPower();
                    if (autoPower > 0) {
                        const gain = Math.floor(autoPower * offlineSeconds * OFFLINE_EFFICIENCY);
                        addCrystalsAndProgress(gain);
                        showToast('💤', `Bem-vindo de volta! Você ganhou ${formatNumber(gain)} cristais offline.`);
                        // BUG FIX A4: disparar desbloqueios que podem ter sido alcançados
                        // durante o período offline (itens especiais, conquistas, dicas).
                        checkSpecialItems();
                        checkHints();
                        checkAchievements();
                    }
                }
            }

            function init() {
                initParticlePool();
                initFloatingTextPool();

                // PARTE 3: restaura o tema futurista se o save estava no futuro.
                if (state.era === 'future') document.body.classList.add('era-future');

                setInterval(gameLoop, 100);
                setInterval(contractCheckInterval, 1000);

                crystalButtonEl.addEventListener('pointerdown', (e) => { e.preventDefault(); clickCrystal(e); });
                crystalButtonEl.setAttribute('tabindex', '0');
                // BUG FIX A6: permitir clicar com teclado (Enter/Espaço) para acessibilidade.
                crystalButtonEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                        e.preventDefault();
                        const rect = crystalButtonEl.getBoundingClientRect();
                        clickCrystal({ clientX: rect.left + rect.width / 2, clientY: rect.top + rect.height / 2 });
                    }
                });
                goldenCrystalEl.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); clickGoldenCrystal(e); });

                $$('.tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        $$('.tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
                        $$('.tab-panel').forEach(p => p.classList.remove('active'));
                        tab.classList.add('active');
                        tab.setAttribute('aria-selected', 'true');
                        document.getElementById(tab.dataset.tab).classList.add('active');
                        const t = tab.dataset.tab;
                        if (t === 'contracts') { needsRenderContracts = true; renderContracts(); }
                        if (t === 'rumors') { needsRenderRumors = true; renderRumors(); }
                        if (t === 'portal') { needsRenderPortal = true; renderPortal(); }
                        if (t === 'upgrades') { needsRenderUpgrades = true; renderUpgrades(); }
                        if (t === 'gacha') { needsRenderGacha = true; renderGacha(); }
                        if (t === 'achievements') { needsRenderAchievements = true; renderAchievements(); }
                        if (t === 'inventory') { needsRenderInventory = true; renderInventory(); }
                        if (t === 'prestige') { needsRenderPrestige = true; renderPrestige(); }
                    });
                });

                document.querySelectorAll('.upgrade-filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.upgrade-filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentUpgradeFilter = btn.dataset.filter;
                        needsRenderUpgrades = true;
                        renderUpgrades();
                    });
                });

                soundToggleEl.addEventListener('click', () => {
                    state.soundEnabled = !state.soundEnabled;
                    soundToggleEl.textContent = state.soundEnabled ? '🔊' : '🔇';
                    saveGameDebounced();
                });
                soundToggleEl.textContent = state.soundEnabled ? '🔊' : '🔇';

                npcDialogCloseEl.addEventListener('click', () => npcDialogEl.classList.add('hidden'));

                modalCancelBtn.addEventListener('click', () => modalOverlayEl.classList.add('hidden'));
                modalOverlayEl.addEventListener('click', (e) => { if (e.target === modalOverlayEl) modalOverlayEl.classList.add('hidden'); });

                if (resetSaveBtn) resetSaveBtn.addEventListener('click', resetSave);
                if (exportSaveBtn) exportSaveBtn.addEventListener('click', exportSave);
                if (importSaveBtn) importSaveBtn.addEventListener('click', importSave);

                window.addEventListener('beforeunload', saveGame);
                window.addEventListener('pagehide', saveGame);
                document.addEventListener('visibilitychange', () => { lastTickTime = Date.now(); });

                if (state.goldenCrystalActive) {
                    const remaining = state.goldenCrystalExpiresAt - Date.now();
                    if (remaining > 0) {
                        goldenCrystalEl.classList.remove('hidden');
                        goldenCrystalEl.style.left = `calc(50% + ${state.goldenCrystalPosX || 40}px)`;
                        goldenCrystalEl.style.top = `calc(50% + ${state.goldenCrystalPosY || -40}px)`;
                        goldenCrystalExpireTimeout = setTimeout(() => { hideGoldenCrystal(); }, remaining);
                    } else {
                        state.goldenCrystalActive = false;
                        goldenCrystalEl.classList.add('hidden');
                        scheduleGoldenCrystal();
                    }
                } else {
                    scheduleGoldenCrystal();
                }

                resetDailyProgressIfNeeded();
                applyOfflineProduction();

                needsRenderUpgrades = true;
                needsRenderAchievements = true;
                needsRenderGacha = true;
                needsRenderPrestige = true;
                needsRenderInventory = true;
                needsRenderContracts = true;
                needsRenderRumors = true;
                needsRenderPortal = true;
                updateDisplay();
                renderAll();
                checkAchievements();
                checkSpecialItems();
                updateContractsBadge();
                console.log('💎 Crystal Miner com todas as correções aplicadas!');
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
